[project]
name = "alpha-robot-mcp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastmcp>=2.11.3,<3", "ros-mcp==3.1.2", "httpx>=0.28,<1", "websockets>=15,<16"]

[project.scripts]
alpha-mcp = "alpha_mcp.server:main"
alpha-ros-inspect = "alpha_mcp.ros_inspect:main"
alpha-readonly-bridge = "alpha_mcp.readonly_bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alpha_mcp"]
