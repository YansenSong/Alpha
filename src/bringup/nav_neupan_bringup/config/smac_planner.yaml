planner_server:
  ros__parameters:
    use_sim_time: false

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"

      downsample_costmap: false
      downsampling_factor: 1
      angle_quantization_bins: 72
      tolerance: 0.25
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      smooth_path: true

      # REQUIRED runtime override from project-level config/vehicle.yaml.
      # Keep an invalid placeholder here so stale vehicle geometry cannot be
      # used silently if the bringup wiring is bypassed.
      minimum_turning_radius: 0.0

      cache_obstacle_heuristic: false
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 6.60
      max_planning_time: 5.0
      lookup_table_size: 20.0
      motion_model_for_search: "REEDS_SHEPP"

      smoother:
        tolerance: 1.0e-10
        max_iterations: 1000
        w_data: 0.2
        w_smooth: 0.3
        do_refinement: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map

      # REQUIRED runtime overrides from config/vehicle.yaml.
      robot_base_frame: "NOT_CONFIGURED"
      footprint: "[]"
      footprint_padding: 0.0

      rolling_window: false
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      filters: ["area_keepout_filter"]
      publish_frequency: 2.0

      area_keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        filter_info_topic: "/area_rules/filter_info"

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""
